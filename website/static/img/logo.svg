<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none" role="img" aria-label="CC の耳を持つ熊。CC は CHACCHAN から">
  <defs>
    <linearGradient id="cc-bear-head" x1="13" y1="18" x2="52" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5a3020"/>
      <stop offset="1" stop-color="#2b1711"/>
    </linearGradient>
    <linearGradient id="cc-bear-caramel" x1="10" y1="3" x2="52" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0b36f"/>
      <stop offset="1" stop-color="#b85f32"/>
    </linearGradient>
  </defs>

  <!-- CHACCHAN の頭文字 CC を、そのまま2つの耳にしたシンボル。 -->
  <path d="M22.2 6.9A9.2 9.2 0 1 0 22.2 20.1" stroke="url(#cc-bear-caramel)" stroke-width="6" stroke-linecap="round"/>
  <path d="M48.2 6.9A9.2 9.2 0 1 0 48.2 20.1" stroke="url(#cc-bear-caramel)" stroke-width="6" stroke-linecap="round"/>

  <path d="M11 35.2C11 22.3 20.3 15 32 15s21 7.3 21 20.2v6.2C53 53.2 44.1 61 32 61S11 53.2 11 41.4v-6.2Z" fill="url(#cc-bear-head)"/>
  <path d="M16.5 34.4C17.8 24.8 24.3 20 32 20s14.2 4.8 15.5 14.4" stroke="#8f5134" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>

  <!-- 目にも小さな C を反復し、小さい表示でも固有の表情を残す。 -->
  <path d="M26.6 33.2a4 4 0 1 0 0 5.6" stroke="#f2c38b" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M41.1 33.2a4 4 0 1 0 0 5.6" stroke="#f2c38b" stroke-width="2.5" stroke-linecap="round"/>

  <ellipse cx="32" cy="46" rx="9.4" ry="7.3" fill="#f4dfc3"/>
  <path d="M28.2 44.7c0-2 1.7-3.3 3.8-3.3s3.8 1.3 3.8 3.3c0 1.7-1.7 3.2-3.8 3.2s-3.8-1.5-3.8-3.2Z" fill="#3a2017"/>
  <path d="M32 48v2.2m0 0c-1.1 1.5-2.6 2.1-4.2 2.1m4.2-2.1c1.1 1.5 2.6 2.1 4.2 2.1" stroke="#6f3925" stroke-width="1.6" stroke-linecap="round"/>
</svg>
